<script>
// GitHub Pages build: index.wasm / index.pck are also shipped gzip-compressed (about 35 MB instead of 88 MB).
// They are inflated in the browser while they stream in, so the loading bar keeps moving.
// Browsers without DecompressionStream fall back to the plain files.
(function(){
  var PACKED={"index.wasm":"application/wasm","index.pck":"application/octet-stream"};
  var realFetch=window.fetch.bind(window);
  window.fetch=function(input, init){
    var url=(typeof input==='string')?input:((input&&input.url)||String(input));
    var path=url.split('?')[0].split('#')[0];
    var key=Object.keys(PACKED).find(function(k){return path.endsWith(k);});
    if(!key||typeof DecompressionStream==='undefined'||typeof ReadableStream==='undefined') return realFetch(input, init);
    return realFetch(path+'.gz', init).then(function(r){
      if(!r.ok||!r.body) return realFetch(input, init);
      var reader=r.body.getReader();
      return reader.read().then(function(first){
        var head=first.value||new Uint8Array(0);
        var gz=head.length>1&&head[0]===0x1f&&head[1]===0x8b;
        var body=new ReadableStream({
          start:function(c){ if(head.length) c.enqueue(head); if(first.done) c.close(); },
          pull:function(c){ return reader.read().then(function(x){ if(x.done) c.close(); else c.enqueue(x.value); }); }
        });
        if(gz) body=body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body,{status:200,headers:{'Content-Type':PACKED[key]}});
      });
    }).catch(function(){ return realFetch(input, init); });
  };
})();
</script>
<script>
(function(){
  var ua=navigator.userAgent;
  window.__megaForceLandscape=/Android|iPhone|iPad|iPod|Mobile/i.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua));
  window.__megaPortrait=function(){return !!window.__megaForceLandscape&&window.innerHeight>window.innerWidth;};
  function apply(){
    var c=document.getElementById('canvas'); if(!c) return;
    var rot=window.__megaPortrait();
    c.__megaRot=rot;
    if(rot){
      c.style.position='absolute'; c.style.left='0px'; c.style.top='0px';
      c.style.transformOrigin='0 0';
      c.style.transform='translate('+window.innerWidth+'px,0) rotate(90deg)';
    } else if(c.style.transform){
      c.style.transform=''; c.style.position=''; c.style.left=''; c.style.top='';
    }
  }
  window.__megaApplyRotation=apply;
  window.addEventListener('resize',function(){setTimeout(apply,0);});
  window.addEventListener('orientationchange',function(){setTimeout(apply,60);});
  document.addEventListener('DOMContentLoaded',apply);
  setInterval(apply,400);
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29826404,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
